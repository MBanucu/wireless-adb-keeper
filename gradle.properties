# Gradle and AGP settings for this repository. Machine-specific paths do not
# belong here: local.properties is per checkout and ignored by git (see
# local.properties.example), and the aapt2 override belongs in
# ~/.gradle/gradle.properties because it is a property of the phone.

org.gradle.jvmargs=-Xmx2g
android.nonTransitiveRClass=true

# Reuse task outputs between clean builds. The cache lives in the Gradle user
# home; docs/termux-build.md records the measured cold/warm times.
org.gradle.caching=true

# The build is configuration-cache compatible on Gradle 9.9.2. A cold,
# --offline first build still needs AGP in the dependency cache; the tools
# script explains how to warm it.
org.gradle.configuration-cache=true

# android.aapt2FromMavenOverride is required on Termux, but AGP labels every use
# of it experimental. The override is the documented workaround; suppress only
# that unsupported-option notice, not other AGP warnings.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Retry transient 429/5xx responses from Maven Central; shared CI egress IPs hit
# them often enough that Gradle's default three tries is not enough.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
