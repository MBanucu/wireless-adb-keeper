name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit suites, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # #68: mDNS discovery is adb-connect from the pinned adb-harness[mdns].
      # This fails if a raw zeroconf browser (or the old adb-mdns.py) comes back.
      - name: Keep mDNS discovery in adb-harness
        run: bash tools/check-adb-harness.sh

      # Two halves of the wrapper: the JAR against Gradle's published
      # checksums, and the distribution URL against its published .sha256.
      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify the Gradle distribution hash
        run: bash tools/check-wrapper.sh --online

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Accelerator only: tests/unit.sh still compares the file list and mtimes,
      # so a restored stamp that no longer matches simply recompiles. The logs
      # and the timing history are deliberately not part of this cache.
      - name: Restore the unit compile stamp
        uses: actions/cache@v4
        with:
          path: |
            tests/out/unit
            tests/out/unit.sources
          key: unit-compile-${{ runner.os }}-${{ hashFiles('src/**/*.java', 'tests/unit/**/*.java') }}
          restore-keys: unit-compile-${{ runner.os }}-

      # One total-ms line per green run, used by tests/gate.sh for the recent
      # median. A miss (first run, evicted cache) skips the comparison instead
      # of failing it.
      - name: Restore the unit timing history
        uses: actions/cache@v4
        with:
          path: tests/out/timings.tsv
          key: unit-timings-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            unit-timings-${{ github.ref_name }}-
            unit-timings-

      # The ubuntu image ships the Android SDK and cmdline-tools, so there is no
      # setup action: android-actions/setup-android still asks sdkmanager for a
      # "tools" package that no longer exists, which fails the job before any
      # Gradle work runs. ANDROID_HOME is already set on the runner.
      - name: Install the compileSdk platform and build tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # cmdline-tools is not on PATH on the runner image, and the versioned
          # directory name changes with image updates.
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "no sdkmanager under $SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;36.0.0"

      - name: Unit suites on a plain JDK, then lint and build
        run: |
          set -euo pipefail
          mkdir -p tests/out
          # The phone path: bash, javac and java only, no Gradle and no build.sh.
          # This runs before any Gradle work in the job.
          status=0
          bash tests/unit.sh 2>&1 | tee tests/out/unit.log || status=$?
          # Prints the check/suite/timing counts, refuses an empty run, and fails
          # only when this run is more than 4x the recent cached median.
          bash tests/gate.sh --log tests/out/unit.log --status "$status"
          # checkBuildEnv is the same preflight tools/termux-build.sh runs; on
          # this runner it should pass without the Termux aapt2 override.
          ./gradlew checkBuildEnv probe lintDebug assembleDebug --stacktrace 2>&1 | tee tests/out/gradle.log

      # A red run should explain itself without a rerun: the check names and
      # expected/actual values are in unit.log (and failing-checks.txt), lint's
      # report is the HTML AGP writes, and gradle.log has the compiler output.
      - name: Upload the failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure
          path: |
            tests/out/unit.log
            tests/out/gate-summary.txt
            tests/out/failing-checks.txt
            tests/out/gradle.log
            build-gradle/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build-gradle/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The Ubuntu job above cannot exercise Termux's bionic aapt2 or the on-phone
  # Gradle daemon. This job runs the documented one-command path on a
  # self-hosted phone runner. It is skipped until a runner labelled
  # `self-hosted, termux` is registered and the repository variable
  # TERMUX_RUNNER_ENABLED is set to `true`; docs/termux-build.md explains how.
  termux:
    name: On-device Termux build
    if: vars.TERMUX_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, termux]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Canonical build through the documented script
        run: OFFLINE=0 bash tools/termux-build.sh lintDebug assembleDebug

      - name: Unit suites on the phone's JDK
        run: bash tests/unit.sh

      - name: Dependency-free bootstrap
        run: bash build.sh

      - name: Upload the on-device APKs
        uses: actions/upload-artifact@v4
        with:
          name: termux-apks
          path: |
            build-gradle/outputs/apk/debug/*.apk
            wifidebug.apk
          if-no-files-found: error
