name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gradle build, lint and device-free probe
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the compileSdk platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;36.0.0"

      # There is no JUnit dependency (it does not resolve offline), so `test` is
      # wired in build.gradle.kts to the device-free IdentityProbe.
      - name: Test, lint and assemble
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build-gradle/outputs/apk/debug/*.apk
          if-no-files-found: error
