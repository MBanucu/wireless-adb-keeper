name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gradle build, lint and device-free probe
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The ubuntu image ships the Android SDK and cmdline-tools, so there is no
      # setup action: android-actions/setup-android still asks sdkmanager for a
      # "tools" package that no longer exists, which fails the job before any
      # Gradle work runs. ANDROID_HOME is already set on the runner.
      - name: Install the compileSdk platform and build tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # cmdline-tools is not on PATH on the runner image, and the versioned
          # directory name changes with image updates.
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "no sdkmanager under $SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;36.0.0"

      # There is no JUnit dependency (it does not resolve offline), so `test` is
      # wired in build.gradle.kts to the device-free tests/unit suites and probes.
      - name: Test, lint and assemble
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build-gradle/outputs/apk/debug/*.apk
          if-no-files-found: error
